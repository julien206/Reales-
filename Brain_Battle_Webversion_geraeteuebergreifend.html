<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Battle - Knowledge Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#312e81);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.card{width:min(760px,97vw);background:#1e293b;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0009;text-align:center}
h1{font-size:40px;margin:0 0 8px}.sub{color:#cbd5e1}
input{width:90%;max-width:420px;padding:15px;border-radius:12px;border:2px solid #64748b;background:#0f172a;color:white;font-size:18px;margin:18px 0}
button{border:0;border-radius:13px;padding:13px 22px;font-size:18px;font-weight:bold;cursor:pointer}
.start{background:#facc15;color:#111827}.next{background:#22c55e;color:white}
.stats{display:flex;justify-content:space-between;font-weight:bold;margin:12px 0}
.level{font-size:17px;color:#fde68a;margin:8px}
.bar{height:12px;background:#334155;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#22c55e;transition:.3s}
#question{font-size:25px;font-weight:bold;margin:24px 0;line-height:1.3}
.answers{display:grid;gap:12px}.answer{background:#334155;color:white;width:100%;text-align:left}.answer:hover{background:#475569}
.correct{background:#16a34a!important}.wrong{background:#dc2626!important}.disabled{pointer-events:none}
#feedback{min-height:28px;font-size:18px;font-weight:bold;margin:16px}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin:20px 0;background:#0f172a;border-radius:12px;overflow:hidden}
th,td{padding:11px;border-bottom:1px solid #334155}th{color:#fde68a}
.rank{font-size:20px}
</style>
</head>
<body>
<div class="card">

<div id="startScreen">
<h1>🧠 Brain Battle!</h1>
<p class="sub">50 English knowledge questions • 3 levels • Scoreboard</p>
<p>Enter your name to begin:</p>
<input id="nameInput" maxlength="20" placeholder="Your name">
<br><button class="start" onclick="startGame()">START QUIZ 🚀</button>
</div>

<div id="game" class="hidden">
<div class="stats"><span>⭐ <span id="score">0</span> pts</span><span>❓ <span id="num">1</span>/50</span></div>
<div class="level" id="level">Level 1 – Easy</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="question"></div>
<div class="answers" id="answers"></div>
<div id="feedback"></div>
<button class="next hidden" id="next" onclick="nextQuestion()">NEXT ➜</button>
</div>

<div id="end" class="hidden">
<h1>🏆 Quiz Complete!</h1>
<p id="playerResult" class="sub"></p>
<div style="font-size:48px;font-weight:bold" id="finalScore"></div>
<p id="result"></p>
<h2>📊 Scoreboard</h2>
<table>
<thead><tr><th>Rank</th><th>Name</th><th>Points</th></tr></thead>
<tbody id="board"></tbody>
</table>
<p class="sub" style="font-size:13px">☁️ Geräteübergreifendes Scoreboard (Firebase).</p>
 <button class="start" onclick="newGame()">PLAY AGAIN 🔄</button>
</div>
</div>

<script>

const questions=[
["What is the largest planet in our Solar System?",["Earth","Jupiter","Mars","Venus"],1],
["How many legs does a spider have?",["6","8","10","12"],1],
["What is H2O?",["Salt","Oxygen","Water","Sugar"],2],

["Which planet is famous for its rings?",["Mercury","Saturn","Neptune","Earth"],1],
["What gas do humans need to breathe?",["Carbon dioxide","Oxygen","Hydrogen","Helium"],1],
["How many continents are there?",["5","6","7","8"],2],
["What is the capital of France?",["London","Paris","Rome","Madrid"],1],

["Which ocean is the largest?",["Atlantic","Indian","Pacific","Arctic"],2],
["What is 12 × 8?",["86","96","108","112"],1],
["Which bird cannot fly?",["Eagle","Penguin","Falcon","Owl"],1],
["How many colors are in a rainbow?",["5","6","7","8"],2],
["What is the closest star to Earth?",["The Moon","Mars","The Sun","Sirius"],2],
["Which country is shaped like a boot?",["Spain","Italy","Brazil","India"],1],
["What is the chemical symbol for gold?",["Ag","Au","Go","Gd"],1],
["How many bones are in the adult human body?",["106","206","306","406"],1],
["Which planet is known as the Red Planet?",["Venus","Mars","Jupiter","Saturn"],1],
["What is the biggest mammal?",["Elephant","Blue whale","Giraffe","Shark"],1],

["Who painted the Mona Lisa?",["Van Gogh","Leonardo da Vinci","Picasso","Monet"],1],
["What is the hardest natural substance?",["Iron","Diamond","Gold","Quartz"],1],
["Which organ pumps blood around the body?",["Lung","Brain","Heart","Kidney"],2],
["What is the smallest prime number?",["0","1","2","3"],2],
["Which language has the most native speakers?",["English","Spanish","Mandarin Chinese","German"],2],
["How many planets are in our Solar System?",["7","8","9","10"],1],
["What is the speed of light closest to?",["300,000 km/s","30,000 km/s","3,000 km/s","3,000,000 km/s"],0],
["Which ancient civilization built the pyramids at Giza?",["Romans","Ancient Egyptians","Vikings","Greeks"],1],
["What is the largest desert on Earth?",["Sahara","Gobi","Antarctic Desert","Arabian Desert"],2],
["Which scientist developed the theory of relativity?",["Isaac Newton","Albert Einstein","Galileo Galilei","Nikola Tesla"],1]
,
["Which planet is closest to the Sun?",["Earth","Mercury","Mars","Venus"],1],
["What is the largest organ of the human body?",["Heart","Brain","Skin","Liver"],2],
["Which animal is the tallest in the world?",["Elephant","Giraffe","Horse","Camel"],1],
["What is 15 × 6?",["80","90","100","110"],1],
["Which country has the Great Wall?",["Japan","China","India","Thailand"],1],
["How many sides does a hexagon have?",["5","6","7","8"],1],
["What do bees make?",["Milk","Honey","Cheese","Bread"],1],
["Which metal is liquid at room temperature?",["Iron","Gold","Mercury","Copper"],2],
["What is the capital of Germany?",["Berlin","Hamburg","Munich","Frankfurt"],0],
["Which planet is known as the Blue Planet?",["Earth","Neptune","Uranus","Venus"],0],
["What is the longest river in South America?",["Amazon River","Nile","Danube","Mississippi"],0],
["Which instrument has black and white keys?",["Guitar","Piano","Drum","Violin"],1],
["How many teeth does a typical adult human have?",["28","30","32","36"],2],
["Which force keeps us on the ground?",["Magnetism","Gravity","Friction","Electricity"],1],
["What is the largest bird in the world?",["Eagle","Ostrich","Penguin","Swan"],1],
["Which country is famous for the Eiffel Tower?",["France","Italy","Spain","Portugal"],0],
["What is the freezing point of water in Celsius?",["0°C","10°C","32°C","100°C"],0],
["Which scientist is famous for the laws of motion?",["Newton","Einstein","Darwin","Edison"],0],
["What is the main language spoken in Brazil?",["Spanish","Portuguese","English","French"],1],
["Which part of a plant usually absorbs water from the soil?",["Flower","Leaf","Root","Fruit"],2],
["Which is the largest continent?",["Africa","Asia","Europe","Australia"],1],
["What is the chemical symbol for oxygen?",["O","Ox","O2","Og"],0],
["How many hours are in one day?",["12","18","24","36"],2],
["Which animal is known for changing its colors?",["Chameleon","Dolphin","Panda","Rabbit"],0],
["What is the capital of Japan?",["Seoul","Tokyo","Beijing","Kyoto"],1],
["Which planet is farthest from the Sun?",["Saturn","Uranus","Neptune","Jupiter"],2],
["What is 144 divided by 12?",["10","11","12","14"],2],
["Which gas do plants take in during photosynthesis?",["Oxygen","Nitrogen","Carbon dioxide","Helium"],2],
["Who wrote Romeo and Juliet?",["William Shakespeare","Charles Dickens","Mark Twain","J.K. Rowling"],0],
["What is the largest internal organ in the human body?",["Heart","Liver","Lung","Kidney"],1],
["Which country has a maple leaf on its flag?",["Canada","USA","Norway","Sweden"],0],
["How many minutes are in an hour?",["30","45","60","90"],2],
["Which animal is the largest land animal?",["Giraffe","Hippopotamus","African elephant","Rhino"],2],
["What is the boiling point of water at sea level?",["50°C","75°C","100°C","150°C"],2],
["Which is the smallest planet in our Solar System?",["Mercury","Mars","Venus","Earth"],0],
["What is the currency of the United Kingdom?",["Euro","Dollar","Pound sterling","Yen"],2],
["Which ocean lies between Africa and Australia?",["Atlantic","Indian","Pacific","Arctic"],1],
["What is the square root of 81?",["7","8","9","10"],2],
["Which scientist studied evolution and natural selection?",["Charles Darwin","Albert Einstein","Isaac Newton","Marie Curie"],0],
["Which country is home to the Great Barrier Reef?",["Australia","Brazil","Mexico","India"],0]

];

let q=0,score=0,player="",answered=false;

// Shared scoreboard via Firebase Realtime Database.
// Fill in the Firebase config below to make scores visible on every device.
const firebaseConfig = {
  apiKey: "DEINE_API_KEY",
  authDomain: "DEIN-PROJEKT.firebaseapp.com",
  databaseURL: "https://DEIN-PROJEKT-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "DEIN-PROJEKT",
  storageBucket: "DEIN-PROJEKT.firebasestorage.app",
  messagingSenderId: "DEINE_SENDER_ID",
  appId: "DEINE_APP_ID"
};

let cloudDb=null;

async function initCloud(){
  if(firebaseConfig.apiKey.startsWith("DEINE_")) return false;
  try{
    if(!window.firebase){
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js";
        s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
      });
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js";
        s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
      });
    }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    cloudDb=firebase.database();
    return true;
  }catch(e){
    console.warn("Cloud scoreboard unavailable:",e);
    return false;
  }
}

const points=Array(10).fill(100).concat(Array(20).fill(150),Array(20).fill(200));

function startGame(){
 player=document.getElementById("nameInput").value.trim();
 if(!player){alert("Please enter your name!");return}
 q=0;score=0;
 document.getElementById("startScreen").classList.add("hidden");
 document.getElementById("end").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 answered=false;
 document.getElementById("score").textContent=score;
 document.getElementById("num").textContent=q+1;
 document.getElementById("fill").style.width=((q)/30*100)+"%";
 let level=q<10?"Level 1 – Easy 🟢":q<30?"Level 2 – Medium 🟡":"Level 3 – Hard 🔴";
 document.getElementById("level").textContent=level+" • "+points[q]+" points";
 document.getElementById("question").textContent=questions[q][0];
 document.getElementById("feedback").textContent="";
 document.getElementById("next").classList.add("hidden");
 let box=document.getElementById("answers");box.innerHTML="";
 questions[q][1].forEach((a,i)=>{
  let b=document.createElement("button");b.className="answer";b.textContent=a;
  b.onclick=()=>answer(i,b);box.appendChild(b);
 });
}
function answer(i,btn){
 if(answered)return;answered=true;
 let correct=questions[q][2];
 document.querySelectorAll(".answer").forEach(b=>b.classList.add("disabled"));
 if(i===correct){
  score+=points[q];btn.classList.add("correct");
  document.getElementById("feedback").textContent="✅ Correct! +"+points[q]+" points!";
 }else{
  btn.classList.add("wrong");
  document.querySelectorAll(".answer")[correct].classList.add("correct");
  document.getElementById("feedback").textContent="❌ Wrong! Correct: "+questions[q][1][correct];
 }
 document.getElementById("score").textContent=score;
 document.getElementById("next").classList.remove("hidden");
}
function nextQuestion(){q++;if(q>=50)finish();else showQuestion()}
function finish(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("end").classList.remove("hidden");
 document.getElementById("finalScore").textContent=score+"/8000";
 document.getElementById("playerResult").textContent=player+" — your final score";
 document.getElementById("result").textContent=
 score>=7000?"🔥 LEGENDARY! You are a knowledge master!":
 score>=5500?"🧠 Excellent! You know a lot!":
 score>=3500?"😎 Great job! Keep learning!":
 "📚 Nice try! Play again and beat your score!";
 saveScore();showBoard();
}
async function saveScore(){
  // Local fallback
  let scores=JSON.parse(localStorage.getItem("brainBattleScores")||"[]");
  scores.push({name:player,score:score});
  scores.sort((a,b)=>b.score-a.score);
  scores=scores.slice(0,10);
  localStorage.setItem("brainBattleScores",JSON.stringify(scores));

  // Shared cloud copy
  if(await initCloud()){
    try{
      await cloudDb.ref("brainBattleScores").push({
        name:player,
        score:score,
        createdAt:firebase.database.ServerValue.TIMESTAMP
      });
    }catch(e){ console.warn("Cloud save failed:",e); }
  }
}

async function showBoard(){
  let scores=[];
  if(await initCloud()){
    try{
      const snap=await cloudDb.ref("brainBattleScores")
        .orderByChild("score").limitToLast(10).once("value");
      snap.forEach(child=>scores.push(child.val()));
      scores.sort((a,b)=>b.score-a.score);
    }catch(e){ console.warn("Cloud load failed:",e); }
  }

  if(!scores.length){
    scores=JSON.parse(localStorage.getItem("brainBattleScores")||"[]");
  }

  document.getElementById("board").innerHTML=scores.map((s,i)=>
    `<tr><td class="rank">${i+1}</td><td>${escapeHtml(s.name)}</td><td>${s.score}</td></tr>`
  ).join("");
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function newGame(){
 document.getElementById("end").classList.add("hidden");
 document.getElementById("startScreen").classList.remove("hidden");
 document.getElementById("nameInput").value="";
}
</script>
</body>
</html>
